spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

ai:
  openai:
    model: gpt-4.1-mini

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    tags:
      application: loving-backend
    export:
      prometheus:
        enabled: true
  
  health:
    db:
      enabled: true
