spring:
  application:
    name: loving-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0&sslmode=verify-full
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000      # 30s to wait for a connection
      max-lifetime: 1800000          # 30 min (must be < DB timeout)
      keepalive-time: 300000         # 5 min (prevents stale connections)

  flyway:
    enabled: true
    locations: classpath:db/migration
    default_schema: loving
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0&sslmode=verify-full
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: loving
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        ddl-auto: validate

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true

supabase:
  url: ${SUPABASE_URL}
  jwt-issuer: ${SUPABASE_URL}/auth/v1
  jwt-jwks-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
  secretKey: ${SUPABASE_SECRET_KEY}

ai:
  openai:
    api-key: ${AI_OPENAI_API_KEY}
    model: gpt-4.1-mini

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui
    operationsSorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        loving.ai.call.duration: false
      percentiles:
        loving.ai.call.duration: 0.5, 0.9, 0.95
    enable:
      http: true
      jvm: true
      hikaricp: true

      system: false
      process: false
      logback: false
      executor: false
      spring:
        data: false
        security: false
      tomcat: false

  otlp:
    metrics:
      export:
        enabled: true
        url: ${GRAFANA_OTLP_URL}/v1/metrics
        step: 120s
        batch-size: 2000
        headers:
          Authorization: Basic ${GRAFANA_OTLP_AUTH_TOKEN}

info:
  app:
    name: Loving Backend
    description: Backend for Loving App
    version: 1.0.0

app:
  usage:
    free:
      daily-ai-messages: 15
      weekly-recommendations: 4
    premium:
      daily-ai-messages: 40
      weekly-recommendations: 8
  features:
    payments-enabled: false
    premium-enabled: false

logging:
  level:
    root: INFO
    com.lovingapp: INFO

    org.springframework: WARN
    org.springframework.boot.web: WARN
    org.springframework.web: WARN

    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF

    com.zaxxer.hikari: WARN
    com.zaxxer.hikari.pool.HikariPool: ERROR