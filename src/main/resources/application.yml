spring:
  application:
    name: loving-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0&sslmode=verify-full
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    default_schema: loving
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0&sslmode=verify-full
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: loving
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        ddl-auto: validate

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true

supabase:
  url: ${SUPABASE_URL}
  jwt-issuer: ${SUPABASE_URL}/auth/v1
  jwt-jwks-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json

ai:
  openai:
    api-key: ${AI_OPENAI_API_KEY}
    model: gpt-4.1-mini
    prompts:
      empathetic-chat-response:
        name: empathetic_chat_response
        id: pmpt_699fd785fc34819087b33231cd9060ff0e4ac7e54210cd79
        version: "6"
      user-context-extraction:
        name: user_context_extraction
        id: pmpt_69b0f66d64388195932ce49c40739a240bc30d0d9cfd7126
        version: "1"
      wrap-up-chat-response:
        name: wrap_up_chat_response
        id: pmpt_69b0f97c27a881909324dd324d3882ed0df189ca14cd810f
        version: "2"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui
    operationsSorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Loving Backend
    description: Backend for Loving App
    version: 0.1.0

app:
  usage:
    free:
      daily-ai-messages: 10
      weekly-recommendations: 3
    premium:
      daily-ai-messages: 20
      weekly-recommendations: 10
  features:
    payments-enabled: false
    premium-enabled: false

logging:
  level:
    root: INFO
    com.lovingapp: INFO
    org.springframework: WARN
    org.springframework.boot.web: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
